<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Product List</title>
    <th:block th:replace="fragments :: head"></th:block>
    <style>
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dropdown-label {
            font-weight: bold;
            margin-right: 8px;
        }

        /* Center the pagination below the product grid */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div th:replace="fragments :: header"></div>
    <div class="content container my-3">
        <h1 class="text-center mb-4" th:text="${title}">Available Products</h1>
        <p><span th:text="${totalItems+' Products found.'}"></span></p>

        <!-- Pagination Size and Sort Controls -->
        <div class="pagination-controls">
            <div>
                <form th:action="@{'/products'+${route}}" method="get" class="form-inline">
                    <label style="padding-right: 10px;">Show</label>
                    <select id="pageSize" name="size" class="custom-select" style="width:auto;" onchange="this.form.submit()">
                        <option th:value="4" th:selected="${pageSize == 4}">4 products per page</option>
                        <option th:value="12" th:selected="${pageSize == 12}">12 products per page</option>
                        <option th:value="24" th:selected="${pageSize == 24}">24 products per page</option>
                        <option th:value="48" th:selected="${pageSize == 48}">48 products per page</option>
                    </select>
                    <input type="hidden" name="page" th:value="${currentPage}" />
                    <input type="hidden" name="sort" th:value="${sortBy}" />
                </form>
            </div>
            <div>
                <form th:action="@{'/products'+${route}}" method="get" class="form-inline">
                    <label style="padding-right: 10px;">Sort By</label>
                    <select id="sortBy" name="sort" class="custom-select" style="width:auto;" onchange="this.form.submit()">
                        <option th:value="a-z" th:selected="${sortBy == 'a-z'}">Alphabetically (A to Z)</option>
                        <option th:value="z-a" th:selected="${sortBy == 'z-a'}">Alphabetically (Z to A)</option>
                        <option th:value="0-n" th:selected="${sortBy == '0-n'}">Price (low to high)</option>
                        <option th:value="n-0" th:selected="${sortBy == 'n-0'}">Price (high to low)</option>
                    </select>
                    <input type="hidden" name="page" th:value="${currentPage}" />
                    <input type="hidden" name="size" th:value="${pageSize}" />
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="row">
            <div th:each="product : ${productPage.content}" class="col-12 col-md-6 col-lg-3 mb-3">
                <a th:href="@{/product/{id}(id=${product.product_id})}" class="text-decoration-none" style="color: black;">
                    <div class="card h-100">
                        <img class="card-img-top" th:src="${'http://localhost:8080/images/' + product.product_name+'_1.jpg'}"
                            alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${product.product_name}"></h5>
                            <p class="card-text" th:text="${product.product_description}"></p>
                            <hr>
                            <p class="card-text"><strong>Price:</strong> $<span th:text="${product.sale_price}"></span></p>
                            <button class="btn btn-primary">View Details</button>
                        </div>
                    </div>
                </a>
            </div>
        </div>
		<h4 style="text-align: center;padding: 20px;" th:if="${totalPages < 1}">There is no produt to show.</h4>
		

        <!-- Conditional Pagination (Shown Only If There Are Products) -->
        <div class="pagination-wrapper" th:if="${totalPages > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <!-- Previous Button -->
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{'/products'+${route}(page=${currentPage - 1}, size=${pageSize}, sort=${sortBy})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Page Numbers -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{'/products'+${route}(page=${i}, size=${pageSize}, sort=${sortBy})}" th:text="${i}"></a>
                    </li>

                    <!-- Next Button -->
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{'/products'+${route}(page=${currentPage + 1}, size=${pageSize}, sort=${sortBy})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <div th:replace="fragments :: scripts"></div>
	<div th:replace="fragments :: footer"></div>
</body>

</html>
