		<div th:fragment="scripts">
			<script>
				$(document).ready(function () {
					function performSearch(query) {
						return $.ajax({
							url: '/products/search',
							type: 'GET',
							data: {query: query},
							dataType: 'json'
						});
					}

					$('#productSearch').autocomplete({
						source: function (request, response) {
							performSearch(request.term).done(function (data) {
								if (data.length === 0) {
									// Show a message when no results are found
									response([{label: 'No results found', value: '', image: '', noResult: true}]);
								} else {
									// Format the data for autocomplete
									response($.map(data, function (product) {
										return {
											label: product.name,
											value: product.name,
											id: product.id,
											image: product.name
										};
									}));
								}
							}).fail(function () {
								response([]);
							});
						},
						minLength: 2,
						select: function (event, ui) {
							// Check if "No results found" item is clicked
							if (ui.item.noResult) {
								// Prevent setting the value and just close the suggestion list
								$('#productSearch').autocomplete('close');
								event.preventDefault();
								return false;
							}

							// If a valid product is selected, navigate to the product's page
							window.location.href = '/product/' + ui.item.id;
						},
						create: function () {
							$(this).data('ui-autocomplete')._renderItem = function (ul, item) {
								// Check for no results
								if (item.noResult) {
									return $('<li class="no-results">')
										.append(`<div style="display: flex; align-items: center;"><span>${item.label}</span></div>`)
										.appendTo(ul);
								}
								return $('<li>')
									.data('item.autocomplete', item)
									.append(`<div style="display: flex; align-items: center;">
		                                    <img src="${'http://localhost:8080/images/' + item.image + '_1.jpg'}" alt="${item.label}" style="width: 50px; height: 50px; margin-right: 10px;">
		                                    <span>${item.label}</span>
		                                  </div>`)
									.appendTo(ul);
							};
						}
					});

					$(document).click(function (e) {
						if (!$(e.target).closest('#productSearch').length) {
							$('#productSuggestions').empty();
						}
					});
				});
			</script>
