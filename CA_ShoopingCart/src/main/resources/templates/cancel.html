<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Cancelled</title>
	<th:block th:replace="fragments :: head"></th:block>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #ff4d4d;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        button {
            background-color: #1fa6f4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #015e94;
        }
    </style>
</head>
<body>
    <div class="content container">
        <h1>Payment Failed</h1>
        <p>You have canceled the payment process.</p>
        <form th:action="@{/cart}" method="get">
            <button type="submit">back to the cart</button>
        </form>
    </div>
	<div th:replace="fragments :: footer"></div>
</body>
</html>
