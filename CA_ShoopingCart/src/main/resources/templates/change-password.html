<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Change Password</title>
	<th:block th:replace="fragments :: head"></th:block>
	<style>
	        body {
	            font-family: Arial, sans-serif;
	            background-color: #f7f7f7;
	        }

	        .profile-container {
	            width: 100%;
	            max-width: 1200px;
	            margin: 20px auto;
	            display: flex;
	        }

	        .sidebar {
	            width: 250px;
	            background-color: #fff;
	            padding: 20px;
	            border-right: 1px solid #ddd;
	            display: flex;
	            flex-direction: column;
	            align-items: center;
	        }

	        .sidebar ul {
	            list-style-type: none;
	            padding-left: 0;
	            width: 100%;
	        }

	        .sidebar ul li {
	            margin-bottom: 10px;
	        }

	        .sidebar ul li a {
	            color: #333;
	            text-decoration: none;
	            display: block;
	            padding: 10px;
	            border-radius: 5px;
	        }

	        .sidebar ul li a.active, .sidebar ul li a:hover {
	            background-color: #e5e5e5;
	        }

	        .profile-avatar {
				font-size: 5em;
	            margin-bottom: 20px;
	            text-align: center;
	        }

	        .profile-avatar img {
	            width: 100px;
	            height: 100px;
	            border-radius: 50%;
	            background-color: #e5e5e5;
	        }

	        .profile-content {
	            flex-grow: 1;
	            background-color: #fff;
	            padding: 20px;
	            border-radius: 8px;
	            margin-left: 20px;
	        }

	        h2 {
	            font-size: 24px;
	            margin-bottom: 20px;
	        }

	        .profile-info {
	            display: flex;
	            flex-direction: column;
	        }

	        .profile-info .info-row {
	            display: flex;
	            justify-content: space-between;
	            margin-bottom: 15px;
	        }

	        .profile-info label {
	            width: 150px;
	            font-weight: bold;
	        }

	        .profile-info input {
	            flex-grow: 1;
	            padding: 8px;
	            border: 1px solid #ddd;
	            border-radius: 4px;
	        }

	        .btn-edit {
	            background-color: #007bff;
	            color: #fff;
	            padding: 10px 20px;
	            border: none;
	            border-radius: 5px;
	            cursor: pointer;
	        }

	        .btn-edit:hover {
	            background-color: #0056b3;
	        }
	    </style>
	<script type="text/javascript">
		function show() {
			var errorMessage = "[[${error}]]";
			if (errorMessage && errorMessage !== "") {
				alert(errorMessage);
			}
			var successMessage = "[[${success}]]";
			if (successMessage && successMessage !== "") {
				alert(successMessage);

			}
		}
	</script>
</head>

<body onload="show()">
	<div th:replace="fragments :: header"></div>

	<!-- Profile Container -->
	<div class="content profile-container">
		<!-- Sidebar -->
		<div class="sidebar">
			<div class="profile-avatar">
			               <i class="fa fa-user" aria-hidden="true"></i>
			           </div>
			<h3>Account Settings</h3>
			<ul>
				<li><a href="/view-profile">My Profile</a></li>
				<li><a class="active" href="/change-password">Change Password</a></li>
			</ul>
		</div>

		<!-- Profile Content -->
		<div class="profile-content">
			<form id="setprofilepassword" action="/change-password" method="post" th:object="${customer}">
				<h2>Change Password</h2>
				<div class="profile-info">
					<div class="info-row">
						<label for="password">Old Password:</label>
						<input type="password" id="password" name="password">
					</div>

					<div class="info-row">
						<label for="new_password">New Password:</label>
						<input type="password" id="new_password" name="new_password">
					</div>

					<div class="info-row">
						<label for="new_password_repeat">Verify Password</label>
						<input type="password" id="new_password_repeat" name="new_password_repeat">
					</div>


					<div class="info-row">
						<button type="submit" class="btn-edit">Save Changes</button>
					</div>
				</div>
		</div>
	</div>
	<div th:replace="fragments :: scripts"></div>
	<div th:replace="fragments :: footer"></div>
</body>

</html>
